services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avalon
      POSTGRES_PASSWORD: avalon
      POSTGRES_DB: avalon
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avalon']
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ['3000:3000']
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://avalon:avalon@db:5432/avalon?schema=public
      ALLOWED_ORIGINS: http://localhost:3000
      SNAPSHOT_ENCRYPTION_KEY: ${SNAPSHOT_ENCRYPTION_KEY:?Set SNAPSHOT_ENCRYPTION_KEY in your shell or .env}
      LOG_LEVEL: info

volumes:
  pgdata:
